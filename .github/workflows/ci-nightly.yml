# Nightly CI: runs additional environments that are too expensive for every push/PR.
# Uses the same reusable workflow as ci.yml for the build + test pattern.

name: CI Nightly

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:

permissions: { }

jobs:
  build-and-test:
    if: github.repository == 'hibernate/hibernate-search'
    uses: ./.github/workflows/ci-build-and-test.yml
    permissions:
      contents: read
    with:
      matrix-json: >-
        [
          { "name": "MySQL", "db-profile": "ci-mysql" },
          { "name": "MariaDB", "db-profile": "ci-mariadb" },
          { "name": "Db2", "runs-on": "runs-on/fleet=linux-standard/env=ibm", "db-profile": "ci-db2" },
          { "name": "MSSQL", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus", "db-profile": "ci-mssql" },
          { "name": "CockroachDB-1", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus",
            "maven-args": "-Pci-cockroachdb -pl :hibernate-search-integrationtest-mapper-orm,:hibernate-search-integrationtest-mapper-orm-jakarta-batch,:hibernate-search-integrationtest-mapper-orm-jakarta-batch-lucene-next" },
          { "name": "CockroachDB-2", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus",
            "maven-args": "-Pci-cockroachdb -pl :hibernate-search-integrationtest-mapper-orm-outbox-polling,:hibernate-search-integrationtest-mapper-orm-realbackend,:hibernate-search-integrationtest-mapper-orm-realbackend-lucene-next,:hibernate-search-integrationtest-mapper-orm-envers,:hibernate-search-integrationtest-mapper-orm-cdi,:hibernate-search-integrationtest-showcase-library,:hibernate-search-integrationtest-showcase-library-lucene-next,:hibernate-search-integrationtest-spring-repackaged-application,:hibernate-search-integrationtest-spring-repackaged-model" },
          { "name": "JDK 21", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "java-test-version": 21, "maven-args": "-f integrationtest -Dgib.buildAll=true" },
          { "name": "JDK 26", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "java-test-version": 26, "maven-args": "-f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true" },
          { "name": "JDK 27", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "java-test-version": 27, "maven-args": "-f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true" },
          { "name": "JDK 28", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "java-test-version": 28, "maven-args": "-f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true" },
          { "name": "Elasticsearch 7.10", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=7.10.2 -Dtest.lucene.skip=true" },
          { "name": "Elasticsearch 7.17", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=7.17.29 -Dtest.lucene.skip=true" },
          { "name": "Elasticsearch 8.19", "runs-on": "runs-on/fleet=linux-standard/env=ibm",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=8.19.19 -Dtest.lucene.skip=true" },
          { "name": "OpenSearch 1.3", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=opensearch -Dtest.elasticsearch.version=1.3.20 -Dtest.lucene.skip=true" },
          { "name": "OpenSearch 2.19", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=opensearch -Dtest.elasticsearch.version=2.19.4 -Dtest.lucene.skip=true" },
          { "name": "Amazon OpenSearch Serverless", "runs-on": "runs-on/fleet=linux-standard/env=commonhaus",
            "maven-args": "-Pdist -Dtest.elasticsearch.distribution=amazon-opensearch-serverless -Dtest.elasticsearch.version= -Dtest.lucene.skip=true" }
        ]
    secrets: inherit
