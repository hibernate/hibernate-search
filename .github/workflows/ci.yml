# See MAINTAINERS.md for details about all available CI jobs.

name: GH Actions CI

on:
  push:
    branches:
      # Pattern order matters: the last matching inclusion/exclusion wins
      - '**'
      - '!3.*'
      - '!4.*'
      - '!5.*'
      - '!6.*'
      # We don't want to run CI on branches for dependabot, just on the PR.
      - '!dependabot/**'
      - '!wip/**/dependency-update/**'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      # Pattern order matters: the last matching inclusion/exclusion wins
      - '**'
      - '!3.*'
      - '!4.*'
      - '!5.*'
      - '!6.*'
      # Ignore dependabot PRs that are not just about build dependencies or workflows;
      # we'll reject such PRs and send one ourselves.
      - '!dependabot/**'
      - 'dependabot/maven/build-dependencies-**'
      - 'dependabot/github_actions/workflow-actions-**'
      - 'dependabot/docker/**/build-containers-**'
      - 'dependabot/docker/**/database-containers-**'

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository != 'hibernate/hibernate-search' }}

defaults:
  run:
    shell: bash

env:
  MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end"
  TESTCONTAINERS_REUSE_ENABLE: true

permissions: { } # none, jobs are defining their own if they need any

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
            name: "Linux JDK 25",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            maven-args: '-Pci-build',
            coverage: true,
            docs-preview: true
          }
          - {
            name: "Linux JDK 17",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            java-test-version: 17,
            maven-args: '-Pci-build -f integrationtest -Dgib.buildAll=true',
            coverage: true
          }
          - {
            name: "Eclipse compiler",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            eclipse: true
          }
          - {
            name: "PostgreSQL",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-postgresql -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "Oracle",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-oracle -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "OpenSearch 3.7",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=opensearch -Dtest.elasticsearch.version=3.7.0 -Dtest.lucene.skip=true',
            coverage: true
          }
          # We can't start Linux containers on GitHub Actions' Windows VMs,
          # so we can't run Elasticsearch tests.
          # See https://github.com/actions/runner-images/issues/1143#issuecomment-972929995
          - {
            name: "Windows JDK 25",
            runs-on: 'windows-latest',
            java-version: 25,
            maven-args: '-Dtest.elasticsearch.skip=true'
          }
    steps:
      - name: Set up RunsOn
        if: ${{ contains(matrix.runs-on, 'runs-on') }}
        uses: runs-on/action@v2
      - name: Support longpaths on Windows
        if: ${{ startsWith(matrix.runs-on, 'windows') }}
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          # Fetch the whole history to make sure that gitflow incremental builder
          # can find the base commit.
          fetch-depth: 0
      # Checkstyle enforces this for the files it processes; this covers all the other ones.
      # Only on Linux: the check is OS-independent, no point in paying for it twice.
      - name: Check that no license header was reintroduced
        if: ${{ startsWith(matrix.runs-on, 'ubuntu') }}
        run: ./ci/check-no-license-headers.sh
      - name: Set up test JDK ${{ matrix.java-test-version }}
        if: ${{ matrix.java-test-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-test-version }}
          distribution: temurin
      - name: Capture test JDK home
        if: ${{ matrix.java-test-version }}
        run: echo "TEST_JDK_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      # https://github.com/actions/cache/blob/main/examples.md#java---maven
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          # use a different key than workflows running in trusted mode
          key: ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh

      - name: Build code and run unit tests and basic checks
        if: ${{ !matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pjqassistant -Pdist -Pci-build -DskipITs
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
      # For jobs running on 'pull_request', upload build scan data.
      # The actual publishing must be done in a separate job (see ci-report.yml).
      # We don't write to the remote cache as that would be unsafe.
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ !matrix.eclipse && github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-initial-${{ matrix.name }}
          path: ~/.m2/.develocity/build-scan-data

      - name: Upload docs preview
        if: ${{ matrix.docs-preview }}
        uses: hibernate/.github/actions/build-docs-preview@197125e1a0e9624349ef9e8157dad8ab707f3da0 # main
        with:
          dist-path: 'documentation/target/dist'
          src-paths: |
            documentation/src

      - name: Run integration tests in the default environment
        if: ${{ !matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          read -ra mvn_matrix_args <<< "$MAVEN_MATRIX_ARGS"
          read -ra mvn_test_jdk_args <<< "$MAVEN_TEST_JDK_ARGS"
          read -ra mvn_incremental <<< "$MAVEN_INCREMENTAL_BUILD"
          ./mvnw "${mvn_args[@]}" "${mvn_matrix_args[@]}" "${mvn_test_jdk_args[@]}" clean verify \
              -Pskip-checks \
              ${{ matrix.coverage && '-Pcoverage' || '' }} \
              "${mvn_incremental[@]}"
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_MATRIX_ARGS: ${{ matrix.maven-args }}
          MAVEN_TEST_JDK_ARGS: ${{ env.TEST_JDK_HOME && format('-Djava-version.test.compiler.java_home={0} -Djava-version.test.release={1}', env.TEST_JDK_HOME, matrix.java-test-version) || '' }}
          MAVEN_INCREMENTAL_BUILD: ${{ github.event.pull_request.base.ref && format('-Dincremental -Dgib.referenceBranch=refs/remotes/origin/{0}', github.event.pull_request.base.ref) || '' }}

      - name: Check compilation with Eclipse compiler
        if: ${{ matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pci-build -DskipTests -DskipITs \
              -Pcompiler-eclipse,!javaModuleITs,!metamodelITs \
              -pl '!:hibernate-search-documentation,!:hibernate-search-documentation-lucene-next,!:hibernate-search-reports' \
              -Dgib.buildAll=true
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"

      # Same as above, but for the build scan of the latest Maven run.
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-integrationtest-${{ matrix.name }}
          path: ~/.m2/.develocity/build-scan-data

      - name: Store coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-coverage-data-${{ matrix.name }}
          retention-days: 1
          path: |
            ./**/jacoco.exec

      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh
      - name: Omit produced artifacts from build cache
        run: rm -r ~/.m2/repository/org/hibernate/search

  # AFTER_MERGE environments: run only on pushes to the main repository.
  # Nightly builds are intentionally kept on free GitHub-hosted runners (queue times don't matter).
  build-after-merge:
    if: github.event_name == 'push' && github.repository == 'hibernate/hibernate-search'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Databases
          - {
            name: "MySQL",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-mysql -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "MariaDB",
            runs-on: 'ubuntu-latest',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-mariadb -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "Db2",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-db2 -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "MSSQL",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Pci-mssql -pl !documentation -pl !integrationtest/mapper/orm-spring -pl !integrationtest/java/modules/orm-lucene -pl !integrationtest/java/modules/orm-elasticsearch -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch -pl !lucene-next/documentation -pl !lucene-next/integrationtest/java/modules/orm-lucene',
            coverage: true
          }
          - {
            name: "CockroachDB-1",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pci-cockroachdb -pl :hibernate-search-integrationtest-mapper-orm,:hibernate-search-integrationtest-mapper-orm-jakarta-batch,:hibernate-search-integrationtest-mapper-orm-jakarta-batch-lucene-next',
            coverage: true
          }
          - {
            name: "CockroachDB-2",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pci-cockroachdb -pl :hibernate-search-integrationtest-mapper-orm-outbox-polling,:hibernate-search-integrationtest-mapper-orm-realbackend,:hibernate-search-integrationtest-mapper-orm-realbackend-lucene-next,:hibernate-search-integrationtest-mapper-orm-envers,:hibernate-search-integrationtest-mapper-orm-cdi,:hibernate-search-integrationtest-showcase-library,:hibernate-search-integrationtest-showcase-library-lucene-next,:hibernate-search-integrationtest-spring-repackaged-application,:hibernate-search-integrationtest-spring-repackaged-model',
            coverage: true
          }
          # Extra JDKs
          - {
            name: "JDK 21",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            java-test-version: 21,
            maven-args: '-Pci-build -f integrationtest -Dgib.buildAll=true',
            coverage: true
          }
          - {
            name: "JDK 26",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            java-test-version: 26,
            maven-args: '-Pci-build -f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true',
            coverage: true
          }
          - {
            name: "JDK 27",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            java-test-version: 27,
            maven-args: '-Pci-build -f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true',
            coverage: true
          }
          - {
            name: "JDK 28",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            java-test-version: 28,
            maven-args: '-Pci-build -f integrationtest -Dgib.buildAll=true -Dtest.launcher.args=--enable-preview -Dnet.bytebuddy.experimental=true',
            coverage: true
          }
          # Elasticsearch versions
          - {
            name: "Elasticsearch 7.10",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=7.10.2 -Dtest.lucene.skip=true',
            coverage: true
          }
          - {
            name: "Elasticsearch 7.17",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=7.17.29 -Dtest.lucene.skip=true',
            coverage: true
          }
          - {
            name: "Elasticsearch 8.19",
            runs-on: 'runs-on/fleet=linux-standard/env=ibm',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=elastic -Dtest.elasticsearch.version=8.19.19 -Dtest.lucene.skip=true',
            coverage: true
          }
          # OpenSearch versions
          - {
            name: "OpenSearch 1.3",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=opensearch -Dtest.elasticsearch.version=1.3.20 -Dtest.lucene.skip=true',
            coverage: true
          }
          - {
            name: "OpenSearch 2.19",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=opensearch -Dtest.elasticsearch.version=2.19.4 -Dtest.lucene.skip=true',
            coverage: true
          }
          - {
            name: "Amazon OpenSearch Serverless",
            runs-on: 'runs-on/fleet=linux-standard/env=commonhaus',
            java-version: 25,
            maven-args: '-Pci-build -Pdist -Dtest.elasticsearch.distribution=amazon-opensearch-serverless -Dtest.elasticsearch.version= -Dtest.lucene.skip=true',
            coverage: true
          }
    steps:
      - name: Set up RunsOn
        if: ${{ contains(matrix.runs-on, 'runs-on') }}
        uses: runs-on/action@v2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up test JDK ${{ matrix.java-test-version }}
        if: ${{ matrix.java-test-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-test-version }}
          distribution: temurin
      - name: Capture test JDK home
        if: ${{ matrix.java-test-version }}
        run: echo "TEST_JDK_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh

      - name: Build code
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pdist -Pci-build -DskipTests -DskipITs
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ !cancelled() }}"
        with:
          name: build-scan-data-initial-${{ matrix.name }}
          path: ~/.m2/.develocity/build-scan-data

      - name: Run tests
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          read -ra mvn_matrix_args <<< "$MAVEN_MATRIX_ARGS"
          read -ra mvn_test_jdk_args <<< "$MAVEN_TEST_JDK_ARGS"
          ./mvnw "${mvn_args[@]}" "${mvn_matrix_args[@]}" "${mvn_test_jdk_args[@]}" clean verify \
              -Pskip-checks \
              ${{ matrix.coverage && '-Pcoverage' || '' }}
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_MATRIX_ARGS: ${{ matrix.maven-args }}
          MAVEN_TEST_JDK_ARGS: ${{ env.TEST_JDK_HOME && format('-Djava-version.test.compiler.java_home={0} -Djava-version.test.release={1}', env.TEST_JDK_HOME, matrix.java-test-version) || '' }}
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ !cancelled() }}"
        with:
          name: build-scan-data-integrationtest-${{ matrix.name }}
          path: ~/.m2/.develocity/build-scan-data

      - name: Store coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-coverage-data-${{ matrix.name }}
          retention-days: 1
          path: |
            ./**/jacoco.exec

      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh
      - name: Omit produced artifacts from build cache
        run: rm -r ~/.m2/repository/org/hibernate/search

  prepare-sonar-bundle:
    name: Prepare build bundle for Sonar scanner
    needs:
      - build
      - build-after-merge
    if: |
      (github.repository == 'hibernate/hibernate-search' || !endsWith(github.ref, '/main'))
      && always() && !cancelled()
      && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: build-coverage-data*
          path: .
          merge-multiple: 'true'
        continue-on-error: true

      - name: Set up Maven
        run: ./mvnw -v

      - name: Merge Jacoco Reports
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" package \
              -Pskip-checks -Pci-build -DskipTests -Pcoverage-report
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"

      - name: Store build info for Sonar scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-results-data
          retention-days: 1
          path: |
            ./**/jacoco.exec
