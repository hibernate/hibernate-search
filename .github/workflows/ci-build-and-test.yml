# Reusable workflow: build once, then run integration tests in parallel.
# Called by ci.yml (before-merge entries) and ci-nightly.yml (after-merge entries).
#
# Test matrix entries support three modes:
# - Default: downloads the initial build artifact and runs integration tests
# - full-build: does a full build + test from scratch (for entries that can't reuse
#   the initial build artifact, e.g. Windows)
# - eclipse: runs a compile-only check with the Eclipse compiler

name: CI Build and Test

on:
  workflow_call:
    inputs:
      matrix-json:
        description: 'JSON array of test matrix entries'
        type: string
        required: true

defaults:
  run:
    shell: bash

env:
  MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end"
  TESTCONTAINERS_REUSE_ENABLE: true
  DB_TEST_MODULES_EXCLUDES: >-
    -pl !documentation
    -pl !integrationtest/mapper/orm-spring
    -pl !integrationtest/java/modules/orm-lucene
    -pl !integrationtest/java/modules/orm-elasticsearch
    -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch
    -pl !lucene-next/documentation
    -pl !lucene-next/integrationtest/java/modules/orm-lucene

permissions: { }

jobs:
  build:
    name: Initial build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-search'
        && 'runs-on/fleet=linux-standard/env=commonhaus'
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Set up RunsOn
        if: github.repository == 'hibernate/hibernate-search'
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that no license header was reintroduced
        run: ./ci/check-no-license-headers.sh
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: 25
          distribution: temurin
      # On push/schedule, save + restore the Maven cache.
      # On PR, restore only to avoid cache poisoning.
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          path: ~/.m2/repository
          key: trusted-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            trusted-${{ runner.os }}-maven-
      - name: Restore local Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        if: github.event_name != 'push' && github.event_name != 'schedule'
        with:
          path: ~/.m2/repository
          key: untrusted-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            untrusted-${{ runner.os }}-maven-
            trusted-${{ runner.os }}-maven-
      - name: Cache Develocity local cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-build-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-build-${{ github.event.pull_request.number || github.ref }}-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh
      - name: Build code and run unit tests
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pjqassistant -Pdist -Pci-build -DskipITs -Pcoverage
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ !cancelled() }}"
        with:
          name: build-scan-data-initial-build
          path: ~/.m2/.develocity/build-scan-data
      - name: Upload docs preview
        if: github.event_name == 'pull_request'
        uses: hibernate/.github/actions/build-docs-preview@197125e1a0e9624349ef9e8157dad8ab707f3da0 # main
        with:
          dist-path: 'documentation/target/dist'
          src-paths: |
            documentation/src
      # Tar the build result (project jars + Develocity cache) for downstream test jobs.
      # Third-party dependencies come from the Maven cache, not from this artifact.
      - name: Tar build result
        run: |
          if [ -d ~/.m2/.develocity/build-cache ]; then
            tar -czf m2-build-result.tgz -C ~ .m2/repository/org/hibernate/search .m2/.develocity/build-cache
          else
            tar -czf m2-build-result.tgz -C ~ .m2/repository/org/hibernate/search
          fi
      - name: Upload build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: m2-build-result
          path: m2-build-result.tgz
          retention-days: 7
      - name: Store coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-coverage-data-Initial build
          retention-days: 1
          path: |
            ./**/jacoco.exec
      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh
      - name: Delete snapshots from cache
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: find ~/.m2 -name \*-SNAPSHOT -type d -exec rm -rf {} +

  test:
    name: ${{ matrix.name }}
    needs: build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-search' && matrix.runs-on
        || !contains(matrix.runs-on || '', 'runs-on') && matrix.runs-on
        || 'ubuntu-latest'
      }}
    timeout-minutes: ${{ matrix.timeout != '' && matrix.timeout || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}
    steps:
      - name: Support longpaths on Windows
        if: ${{ startsWith(matrix.runs-on || '', 'windows') }}
        run: git config --global core.longpaths true
      - name: Set up RunsOn
        if: ${{ contains(matrix.runs-on || '', 'runs-on') && github.repository == 'hibernate/hibernate-search' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up test JDK ${{ matrix.java-test-version }} from jdk.java.net
        if: ${{ matrix.java-test-version && matrix.java-test-from == 'jdk.java.net' }}
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: ${{ matrix.java-test-version }}
      - name: Set up test JDK ${{ matrix.java-test-version }}
        if: ${{ matrix.java-test-version && matrix.java-test-from != 'jdk.java.net' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-test-version }}
          distribution: temurin
      - name: Capture test JDK home
        if: ${{ matrix.java-test-version }}
        run: echo "TEST_JDK_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Java ${{ matrix.java-version || '25' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: ${{ matrix.java-version || '25' }}
          distribution: temurin
      # For entries that depend on the initial build: restore Maven cache + download build artifact.
      - name: Restore local Maven repository
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          key: trusted-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            trusted-${{ runner.os }}-maven-
      - name: Download build result
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: m2-build-result
          path: .
      - name: Extract build result
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        run: tar -xzf m2-build-result.tgz -C ~
      - name: Cache Develocity local cache
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}-
      # For standalone entries (Windows, Eclipse): use full Maven cache (save + restore).
      - name: Cache local Maven repository
        if: ${{ matrix.full-build || matrix.eclipse }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        if: ${{ !startsWith(matrix.runs-on || '', 'windows') }}
        run: ./ci/docker-cleanup.sh

      # --- Standard integration test run (depends on initial build) ---
      - name: Run integration tests
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          read -ra mvn_matrix_args <<< "$MAVEN_MATRIX_ARGS"
          read -ra mvn_test_jdk_args <<< "$MAVEN_TEST_JDK_ARGS"
          read -ra mvn_incremental <<< "$MAVEN_INCREMENTAL_BUILD"
          db_args=()
          if [[ -n "$DB_PROFILE" ]]; then
            read -ra db_excludes <<< "$DB_TEST_MODULES_EXCLUDES"
            db_args+=("-P$DB_PROFILE" "${db_excludes[@]}")
          fi
          ./mvnw "${mvn_args[@]}" "${mvn_matrix_args[@]}" "${mvn_test_jdk_args[@]}" "${db_args[@]}" clean verify \
              -Pskip-checks -Pci-build \
              ${{ matrix.coverage != false && '-Pcoverage' || '' }} \
              "${mvn_incremental[@]}"
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_MATRIX_ARGS: ${{ matrix.maven-args }}
          DB_PROFILE: ${{ matrix.db-profile }}
          MAVEN_TEST_JDK_ARGS: >-
            ${{
              env.TEST_JDK_HOME
              && format('-Djava-version.test.compiler.java_home={0} -Djava-version.test.release={1}',
                env.TEST_JDK_HOME, matrix.java-test-version)
              || ''
            }}
          MAVEN_INCREMENTAL_BUILD: >-
            ${{
              github.event.pull_request.base.ref
              && format('-Dincremental -Dgib.referenceBranch=refs/remotes/origin/{0}',
                github.event.pull_request.base.ref)
              || ''
            }}

      # --- Full build + test (for entries that can't reuse the initial build, e.g. Windows) ---
      - name: Build and run tests
        if: ${{ matrix.full-build }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          read -ra mvn_matrix_args <<< "$MAVEN_MATRIX_ARGS"
          ./mvnw "${mvn_args[@]}" "${mvn_matrix_args[@]}" clean verify \
              -Pci-build
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_MATRIX_ARGS: ${{ matrix.maven-args }}

      # --- Eclipse compiler check (compile-only, no tests) ---
      - name: Check compilation with Eclipse compiler
        if: ${{ matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pci-build -DskipTests -DskipITs \
              -Pcompiler-eclipse,!javaModuleITs,!metamodelITs \
              -pl '!:hibernate-search-documentation,!:hibernate-search-documentation-lucene-next,!:hibernate-search-reports' \
              -Dgib.buildAll=true
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"

      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: "${{ !cancelled() }}"
        with:
          name: build-scan-data-${{ matrix.name }}
          path: ~/.m2/.develocity/build-scan-data
      - name: Store coverage report
        if: ${{ matrix.coverage != false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-coverage-data-${{ matrix.name }}
          retention-days: 1
          path: |
            ./**/jacoco.exec
      - name: Docker cleanup
        if: ${{ !startsWith(matrix.runs-on || '', 'windows') }}
        run: ./ci/docker-cleanup.sh
      - name: Omit produced artifacts from build cache
        if: ${{ !matrix.full-build && !matrix.eclipse }}
        run: rm -r ~/.m2/repository/org/hibernate/search

  prepare-sonar-bundle:
    name: Prepare build bundle for Sonar scanner
    needs: test
    if: >-
      always() && !cancelled()
      && (github.repository == 'hibernate/hibernate-search' || !endsWith(github.ref, '/main'))
      && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'trusted' || 'untrusted' }}-${{ runner.os }}-maven-

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: build-coverage-data*
          path: .
          merge-multiple: 'true'
        continue-on-error: true

      - name: Set up Maven
        run: ./mvnw -v

      - name: Merge Jacoco Reports
        run: |
          read -ra mvn_args <<< "$MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" package \
              -Pskip-checks -Pci-build -DskipTests -DskipITs -Pcoverage-report
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"

      - name: Store build info for Sonar scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: build-results-data
          retention-days: 1
          path: |
            ./**/jacoco.exec
            ./**/target/classes/
            ./**/target/generated/
            ./**/target/resources/
            build/reports/target/site/jacoco-aggregate/jacoco.xml
