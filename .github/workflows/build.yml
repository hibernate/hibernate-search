# See MAINTAINERS.md for details about all available CI jobs.
#
# Reusable workflow: build once, then run integration tests in parallel.
# Called by ci.yml (before-merge entries) and nightly.yml (after-merge entries).
#
# --- Jobs ---
#
# build:          Compile sources, run unit tests, build docs. Shares project JARs
#                 and Develocity build cache as a tarball artifact with downstream
#                 test jobs so they can skip recompilation.
# static-checks:  Checkstyle, jqassistant, enforcer, forbidden-apis, license header
#                 check. Runs independently of the initial build.
# test:           Matrix-driven integration tests. Two modes:
#                 - Default: downloads the initial build artifact
#                 - full-build: builds from scratch (Windows, Eclipse compiler check)
# prepare-sonar-bundle: Merges JaCoCo reports for the Sonar scanner (opt-in).

name: CI Build

on:
  workflow_call:
    inputs:
      initial-build-runs-on:
        description: 'Runner label for the initial build job'
        type: string
        required: false
        default: 'ubuntu-latest'
      matrix-json:
        description: 'JSON array of test matrix entries'
        type: string
        required: true
      run-sonar:
        description: 'Whether to prepare a Sonar coverage bundle after tests'
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  MAVEN_JAVA_VERSION: '25'
  COMMON_MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end -Pci-build"
  TESTCONTAINERS_REUSE_ENABLE: true
  MAVEN_ARGS_DB_MODULE_EXCLUDES: >-
    -pl !documentation
    -pl !integrationtest/mapper/orm-spring
    -pl !integrationtest/java/modules/orm-lucene
    -pl !integrationtest/java/modules/orm-elasticsearch
    -pl !integrationtest/java/modules/orm-outbox-polling-elasticsearch
    -pl !lucene-next/documentation
    -pl !lucene-next/integrationtest/java/modules/orm-lucene

permissions: { }

jobs:
  build:
    name: Initial build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-search' && inputs.initial-build-runs-on
        || !contains(inputs.initial-build-runs-on, 'runs-on') && inputs.initial-build-runs-on
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Set up RunsOn
        if: ${{ contains(inputs.initial-build-runs-on, 'runs-on') && github.repository == 'hibernate/hibernate-search' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch the whole history to make sure that gitflow incremental builder
          # can find the base commit.
          fetch-depth: 0
      - name: Set up Java ${{ env.MAVEN_JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.MAVEN_JAVA_VERSION }}
          distribution: temurin
      # Save + restore the Maven cache; restore only on PRs
      # to avoid accumulating per-PR caches.
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Restore local Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Cache Develocity local cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-build-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-build-${{ github.event.pull_request.number || github.ref }}-
            develocity-cache-build-refs/heads/${{ github.event.pull_request.base.ref || github.ref_name }}-
            develocity-cache-build-refs/heads/main-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        run: ./ci/docker-cleanup.sh
      - name: Build code and run unit tests
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pskip-checks -Pdist -DskipITs -Pcoverage
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
      # Upload build scan data so that ci-report.yml can publish it.
      # Only on PRs: push/schedule builds publish scans directly via DEVELOCITY_ACCESS_KEY.
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-initial-build
          path: ~/.m2/.develocity/build-scan-data
      - name: Upload docs preview
        if: github.event_name == 'pull_request'
        uses: hibernate/.github/actions/build-docs-preview@197125e1a0e9624349ef9e8157dad8ab707f3da0 # main
        with:
          dist-path: 'documentation/target/dist'
          src-paths: |
            documentation/src
      # Tar the build result (project jars + Develocity cache) for downstream test jobs.
      # Third-party dependencies come from the Maven cache, not from this artifact.
      - name: Tar build result
        run: |
          if [ -d ~/.m2/.develocity/build-cache ]; then
            tar -czf m2-build-result.tgz -C ~ .m2/repository/org/hibernate/search .m2/.develocity/build-cache
          else
            tar -czf m2-build-result.tgz -C ~ .m2/repository/org/hibernate/search
          fi
      - name: Upload build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-build-result
          path: m2-build-result.tgz
          retention-days: 1
      - name: Store coverage report
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-coverage-data-Initial build
          retention-days: 1
          path: |
            ./**/jacoco.exec
      - name: Docker cleanup
        if: "${{ !cancelled() }}"
        run: ./ci/docker-cleanup.sh
      - name: Delete snapshots from cache
        if: github.event_name != 'pull_request'
        run: find ~/.m2 -name \*-SNAPSHOT -type d -exec rm -rf {} +

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checkstyle enforces this for the files it processes; this covers all the other ones.
      - name: Check that no license header was reintroduced
        run: ./ci/check-no-license-headers.sh
      - name: Set up Java ${{ env.MAVEN_JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.MAVEN_JAVA_VERSION }}
          distribution: temurin
      # Restore-only: the initial build job saves the cache; this job just reads it.
      - name: Restore local Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Cache Develocity local cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-static-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-static-checks-${{ github.event.pull_request.number || github.ref }}-
            develocity-cache-build-${{ github.event.pull_request.number || github.ref }}-
            develocity-cache-build-refs/heads/${{ github.event.pull_request.base.ref || github.ref_name }}-
            develocity-cache-build-refs/heads/main-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Run static checks
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -Pjqassistant -DskipTests -DskipITs
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-static-checks
          path: ~/.m2/.develocity/build-scan-data

  test:
    name: >-
      ${{ matrix.name
      }}${{ matrix.es-version && format(' {0}', matrix.es-version)
      || matrix.java-test-version && format(' {0}', matrix.java-test-version)
      || '' }}
    needs: build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-search' && matrix.runs-on
        || !contains(matrix.runs-on || '', 'runs-on') && matrix.runs-on
        || 'ubuntu-latest'
      }}
    timeout-minutes: ${{ matrix.timeout != '' && matrix.timeout || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}
    steps:
      - name: Support longpaths on Windows
        if: ${{ startsWith(matrix.runs-on || '', 'windows') }}
        run: git config --global core.longpaths true
      - name: Set up RunsOn
        if: ${{ contains(matrix.runs-on || '', 'runs-on') && github.repository == 'hibernate/hibernate-search' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch the whole history to make sure that gitflow incremental builder
          # can find the base commit.
          fetch-depth: 0
      - name: Compute entry label
        run: |
          echo "ENTRY_LABEL=${_LABEL//[\":<>|*?\\\/]/-}" >> "$GITHUB_ENV"
          echo "SUREFIRE_ENV=${_LABEL//[^a-zA-Z0-9_+-]/_}" >> "$GITHUB_ENV"
        env:
          _LABEL: >-
            ${{ matrix.name
            }}${{ matrix.es-version && format(' {0}', matrix.es-version)
            || matrix.java-test-version && format(' {0}', matrix.java-test-version)
            || '' }}

      # --- JDK setup ---
      # Install test JDK first (if needed and different from the Maven JDK),
      # capture its home, then install the Maven JDK which becomes JAVA_HOME.
      - name: Set up test JDK ${{ matrix.java-test-version }} from jdk.java.net
        if: ${{ matrix.java-test-version && matrix.java-test-from == 'jdk.java.net' }}
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: ${{ matrix.java-test-version }}
      - name: Set up test JDK ${{ matrix.java-test-version }}
        if: ${{ matrix.java-test-version && matrix.java-test-version != env.MAVEN_JAVA_VERSION && matrix.java-test-from != 'jdk.java.net' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-test-version }}
          distribution: temurin
      - name: Capture test JDK home
        if: ${{ matrix.java-test-version && matrix.java-test-version != env.MAVEN_JAVA_VERSION }}
        run: echo "TEST_JDK_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Java ${{ env.MAVEN_JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.MAVEN_JAVA_VERSION }}
          distribution: temurin

      # --- Caching ---
      # For default entries: restore Maven cache (read-only) + download build artifact.
      - name: Restore local Maven repository
        if: ${{ !matrix.full-build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Download build result
        if: ${{ !matrix.full-build }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2-build-result
          path: .
      - name: Extract build result
        if: ${{ !matrix.full-build }}
        run: |
          tar -xzf m2-build-result.tgz -C ~
          rm m2-build-result.tgz
      # For full-build entries (Windows, Eclipse): use full Maven cache (save + restore).
      - name: Cache local Maven repository
        if: ${{ matrix.full-build }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      # Develocity build cache: persisted per job across runs to avoid re-executing goals.
      - name: Cache Develocity local cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-${{ env.ENTRY_LABEL }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-${{ env.ENTRY_LABEL }}-${{ github.event.pull_request.number || github.ref }}-
            develocity-cache-${{ env.ENTRY_LABEL }}-refs/heads/${{ github.event.pull_request.base.ref || github.ref_name }}-
            develocity-cache-${{ env.ENTRY_LABEL }}-refs/heads/main-
      - name: Set up Maven
        run: ./mvnw -v
      - name: Docker cleanup
        if: ${{ !startsWith(matrix.runs-on || '', 'windows') }}
        run: ./ci/docker-cleanup.sh
      - name: Determine test modules
        run: |
          if [[ -n "$_IT_ARTIFACT" ]]; then
            modules=$(./ci/list-dependent-integration-tests.sh "$_IT_ARTIFACT")
            echo "MAVEN_ARGS_IT_MODULES=-pl $modules" >> "$GITHUB_ENV"
          fi
        env:
          _IT_ARTIFACT: >-
            ${{
              matrix.db-profile && 'hibernate-search-mapper-orm'
              || matrix.es-distribution && 'hibernate-search-backend-elasticsearch'
              || ''
            }}

      # --- Standard integration test run (depends on initial build) ---
      - name: Run integration tests
        if: ${{ !matrix.full-build }}
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          read -ra _a <<< "$MAVEN_ARGS_TEST_JDK"; mvn_args+=("${_a[@]}")
          if [[ -n "$DB_PROFILE" ]]; then
            read -ra _a <<< "$MAVEN_ARGS_DB_MODULE_EXCLUDES"
            mvn_args+=("-P$DB_PROFILE" "${_a[@]}")
          fi
          read -ra _a <<< "$MAVEN_ARGS_IT_MODULES"; mvn_args+=("${_a[@]}")
          read -ra _a <<< "$MAVEN_ARGS_ES"; mvn_args+=("${_a[@]}")
          read -ra _a <<< "$MAVEN_ARGS_INCREMENTAL"; mvn_args+=("${_a[@]}")
          read -ra _a <<< "$MAVEN_ARGS_MATRIX"; mvn_args+=("${_a[@]}")
          ./mvnw "${mvn_args[@]}" clean verify \
              -Pskip-checks \
              -Dsurefire.environment="$SUREFIRE_ENV" \
              ${{ matrix.coverage != false && '-Pcoverage' || '' }}
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_ARGS_MATRIX: ${{ matrix.maven-args }}
          DB_PROFILE: ${{ matrix.db-profile }}
          MAVEN_ARGS_ES: >-
            ${{
              matrix.es-distribution
              && format('-Dtest.elasticsearch.distribution={0} -Dtest.elasticsearch.version={1} -Dtest.lucene.skip=true',
                matrix.es-distribution, matrix.es-version || '')
              || ''
            }}
          MAVEN_ARGS_TEST_JDK: >-
            ${{
              env.TEST_JDK_HOME
              && format('-Djava-version.test.compiler.java_home={0} -Djava-version.test.release={1}',
                env.TEST_JDK_HOME, matrix.java-test-version)
              || ''
            }}
          MAVEN_ARGS_INCREMENTAL: >-
            ${{
              github.event.pull_request.base.ref
              && format('-Dincremental -Dgib.referenceBranch=refs/remotes/origin/{0}',
                github.event.pull_request.base.ref)
              || ''
            }}

      # --- Full build + test (for entries that can't reuse the initial build, e.g. Windows) ---
      - name: Build and run tests
        if: ${{ matrix.full-build && !matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          read -ra _a <<< "$MAVEN_ARGS_MATRIX"; mvn_args+=("${_a[@]}")
          ./mvnw "${mvn_args[@]}" clean verify \
              -Dsurefire.environment="$SUREFIRE_ENV"
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"
          MAVEN_ARGS_MATRIX: ${{ matrix.maven-args }}

      # --- Eclipse compiler check (compile-only, no tests) ---
      - name: Check compilation with Eclipse compiler
        if: ${{ matrix.eclipse }}
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" clean install \
              -DskipTests -DskipITs \
              -Pcompiler-eclipse,!javaModuleITs,!metamodelITs \
              -pl '!:hibernate-search-documentation,!:hibernate-search-documentation-lucene-next,!:hibernate-search-reports' \
              -Dgib.buildAll=true
        env:
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY || '' }}"
          DEVELOCITY_BASE_URL: "${{ env.DEVELOCITY_BASE_URL || 'https://develocity.commonhaus.dev' }}"

      # Upload build scan data so that ci-report.yml can publish it.
      # Only on PRs: push/schedule builds publish scans directly via DEVELOCITY_ACCESS_KEY.
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-${{ env.ENTRY_LABEL }}
          path: ~/.m2/.develocity/build-scan-data
      - name: Store coverage report
        if: ${{ !cancelled() && matrix.coverage != false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-coverage-data-${{ env.ENTRY_LABEL }}
          retention-days: 1
          path: |
            ./**/jacoco.exec
      - name: Docker cleanup
        if: ${{ !cancelled() && !startsWith(matrix.runs-on || '', 'windows') }}
        run: ./ci/docker-cleanup.sh
      - name: Omit produced artifacts from build cache
        if: ${{ !matrix.full-build }}
        run: rm -r ~/.m2/repository/org/hibernate/search

  prepare-sonar-bundle:
    name: Prepare build bundle for Sonar scanner
    needs: test
    if: >-
      inputs.run-sonar
      && always() && !cancelled()
      && (github.repository == 'hibernate/hibernate-search' || !endsWith(github.ref, '/main'))
      && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.MAVEN_JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.MAVEN_JAVA_VERSION }}
          distribution: temurin

      - name: Restore local Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-coverage-data*
          path: .
          merge-multiple: 'true'
        continue-on-error: true

      - name: Set up Maven
        run: ./mvnw -v

      - name: Merge Jacoco Reports
        run: |
          read -ra mvn_args <<< "$COMMON_MAVEN_ARGS"
          ./mvnw "${mvn_args[@]}" package \
              -Pskip-checks -DskipTests -DskipITs -Pcoverage-report

      - name: Store build info for Sonar scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-results-data
          retention-days: 1
          path: |
            ./**/jacoco.exec
            ./**/target/classes/
            ./**/target/generated/
            ./**/target/resources/
            build/reports/target/site/jacoco-aggregate/jacoco.xml
